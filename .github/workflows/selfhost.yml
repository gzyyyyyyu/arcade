# 自托管（tools/selfhost + packages/arcade-host）的整站验证：只测不部署，不碰线上、不用凭证（冒烟用的 pepper 和管理令牌是这次运行临时生成的）。
#   binary：启动脚本单测 → 打平台和德州 → 发布包 → 解开用 bin/arcade 起 → 全站冒烟 → 备份 → 恢复演练 → wrangler 写法的库导入后再备份 → ARCADE_VARS_* 改限流、重启后生效再恢复；发布包交给 docker 作业；
#   docker：同一个发布包做成镜像、起容器 → 冒烟（管理入口只在容器里，备份和定时任务用 docker exec 跑）；compose 文件校验；
#   pg：PostgreSQL 模式（postgres:17 服务容器，测试密码固定，只在这次运行里）。平台每条 SQL 在 PG 上 PREPARE、覆盖表和 SQLite 对照（check-sql）→
#       SQLite 档起站冒烟、备份 → PG 档起站冒烟 → 把 SQLite 的备份迁进 PG、逐行核对（verify-import）→ 迁移后再冒烟一次。
#       → 房间也进 PG（pg + memory，什么都不落盘）：冒烟、开房记下房间码 → 重启 → 两人回到同一个房间（宿主重启后按 PG 里的闹钟唤醒）。
#   docker-pg：pg 作业的 pg + memory 发布包做成镜像，compose --profile pg 起 arcade + postgres（Secret、密码文件、健康检查依赖都按 compose 文件走）→
#       冒烟 → 重启 arcade 后回到同一个房间 → 容器里跑定时任务和备份（平台库在 PG，跳过）。
#       pg + memory 要 kit 0.21.0 起的 KIT_STORE。
# 只在 PR 改了自托管相关的路径时跑，也能手动跑（四个作业加起来要几十分钟运行时间）：平台或德州有大改、怕影响自托管时，对那个分支手动跑一次。
name: Self-host
on:
  pull_request:
    paths:
      - 'tools/selfhost/**'
      - 'tools/deployer/**'
      - 'tools/workers.json'
      - 'tools/deploy-allowlist.json'
      - 'packages/arcade-host/**'
      - '.github/workflows/selfhost.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selfhost-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/arcade-host/.nvmrc
          cache: npm
          cache-dependency-path: |
            tools/deployer/package-lock.json
            packages/arcade-host/package-lock.json
            platform/package-lock.json
            games/texas/package-lock.json
      - name: 启动脚本和 runtime_vars 计算的单测（node 内置测试）
        run: node --test "tools/selfhost/test/*.test.mjs"
      - name: 装钉死的 wrangler 和运行时
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/deployer
          (cd packages/arcade-host && npm ci --no-audit --no-fund && npm run build)
      - name: 打包平台和德州
        run: tools/selfhost/pack-all.sh "$RUNNER_TEMP/art" arcade texas
      - name: 发布包
        env:
          ARCADE_VERSION: ci-${{ github.sha }}
        run: tools/selfhost/release.sh "$RUNNER_TEMP/art" "$RUNNER_TEMP/out" --only arcade,texas
      - name: 临时 Secret（只在这次运行里）
        run: |
          r() { echo "k1:$(head -c 32 /dev/urandom | base64 | tr -d '/+=')"; }
          # mask 那行要打到日志（stdout）里才生效，值只写进文件
          : > "$RUNNER_TEMP/secrets.env"
          for k in PEPPER_PW PEPPER_RC PEPPER_SID PEPPER_IP ADMIN_TOKEN; do v=$(r); echo "::add-mask::$v"; echo "$k=$v" >> "$RUNNER_TEMP/secrets.env"; done
      - name: 二进制起站点、冒烟、备份、恢复演练
        run: |
          rel="$RUNNER_TEMP/out/arcade-ci-${{ github.sha }}"
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          ARCADE_DATA="$RUNNER_TEMP/data" "$rel/bin/arcade" > "$RUNNER_TEMP/workerd.log" 2>&1 &
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:8787/__health >/dev/null 2>&1 && break; sleep 0.2; done
          node tools/selfhost/smoke.mjs
          "$rel/ops/backup.sh" "$RUNNER_TEMP/backups" http://127.0.0.1:8788 "$RUNNER_TEMP/data"
          "$rel/ops/restore-drill.sh" "$rel" "$(ls -d "$RUNNER_TEMP"/backups/*/ | tail -1)"
          # 从 wrangler d1 export 导入的库（表名带引号）也要能备份：把备份改成 wrangler 的写法导入，再备份一次
          last="$(ls -d "$RUNNER_TEMP"/backups/*/ | tail -1)d1-arcade-DB.sql"
          sed -E 's/^CREATE TABLE d1_migrations[[:space:]]*\(/CREATE TABLE IF NOT EXISTS "d1_migrations"(/' "$last" > "$RUNNER_TEMP/wrangler-style.sql"
          grep -q '^CREATE TABLE IF NOT EXISTS "d1_migrations"(' "$RUNNER_TEMP/wrangler-style.sql"
          curl -fsS -X POST --data-binary "@$RUNNER_TEMP/wrangler-style.sql" http://127.0.0.1:8788/d1/d1-arcade-DB/import | grep -q '"ok":true'
          sleep 1
          "$rel/ops/backup.sh" "$RUNNER_TEMP/backups" http://127.0.0.1:8788 "$RUNNER_TEMP/data"
          grep -q '^CREATE TABLE IF NOT EXISTS "d1_migrations"(' "$(ls -d "$RUNNER_TEMP"/backups/*/ | tail -1)d1-arcade-DB.sql"
          # 管理入口不许听回环以外的地址
          if ARCADE_ADMIN_LISTEN=0.0.0.0:9999 ARCADE_DATA="$RUNNER_TEMP/x" "$rel/bin/arcade"; then echo "::error::管理入口听了 0.0.0.0"; exit 1; fi
      - name: 运行时改 var（ARCADE_VARS_*）：把匿名限流改小，重启后 429，恢复后不再 429
        run: |
          rel="$RUNNER_TEMP/out/arcade-ci-${{ github.sha }}"
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          export SITE_ORIGIN=http://127.0.0.1:8797 ARCADE_DATA="$RUNNER_TEMP/data-vars" ARCADE_LISTEN=127.0.0.1:8797 ARCADE_ADMIN_LISTEN=127.0.0.1:8798
          pid=
          trap '[ -z "$pid" ] || kill "$pid" 2>/dev/null || true' EXIT
          up() {
            "$rel/bin/arcade" >> "$RUNNER_TEMP/workerd-vars.log" 2>&1 &
            pid=$!
            for _ in $(seq 50); do curl -fsS http://127.0.0.1:8797/__health >/dev/null 2>&1 && return; sleep 0.2; done
            return 1
          }
          down() { kill "$pid"; wait "$pid" || true; pid=; }
          # 匿名接口（注册）每个 IP 每分钟 anonPerIpPerMinute 次（默认 10），令牌在校验之前扣：注册关着的 403 也算一次，超了才是 429
          codes() {
            for _ in 1 2 3 4; do
              curl -s -o /dev/null -w '%{http_code} ' -X POST -H 'content-type: application/json' -H 'x-arcade: 1' -H "origin: $SITE_ORIGIN" -d '{}' http://127.0.0.1:8797/api/auth/register
            done
          }
          up; c=$(codes); echo "默认：$c"
          case "$c" in *429*) echo "::error::没覆盖时就 429"; exit 1 ;; esac
          down
          ARCADE_VARS_arcade_LIMITS='{"anonPerIpPerMinute":2}' up; c=$(codes); echo "覆盖：$c"
          case "$c" in *429*) ;; *) echo "::error::覆盖了 LIMITS 但限流没变"; exit 1 ;; esac
          down
          # 不认识的名字（GATE 不在可覆盖的里面）起不来
          if ARCADE_VARS_texas_GATE=none timeout 20 "$rel/bin/arcade" >/dev/null 2>&1; then echo "::error::GATE 居然能覆盖"; exit 1; fi
          up; c=$(codes); echo "恢复：$c"
          case "$c" in *429*) echo "::error::去掉覆盖后限流没恢复"; exit 1 ;; esac
          down
      - name: README 教的写法（一行、不加引号）经 systemd 的 EnvironmentFile 原样到进程
        run: |
          printf '%s\n' 'ARCADE_VARS_arcade_LIMITS={"readonly":{"calls":20000000},"loginAllHour":5000}' > "$RUNNER_TEMP/vars.env"
          got=$(sudo systemd-run --quiet --wait --pipe -p EnvironmentFile="$RUNNER_TEMP/vars.env" printenv ARCADE_VARS_arcade_LIMITS)
          [ "$got" = '{"readonly":{"calls":20000000},"loginAllHour":5000}' ] || { echo "::error::systemd 改了值：$got"; exit 1; }
      - name: 失败时的 workerd 日志
        if: failure()
        run: tail -200 "$RUNNER_TEMP"/workerd*.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-release
          path: ${{ runner.temp }}/out/*.tar.gz
          retention-days: 1
  docker:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/arcade-host/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfhost-release
          path: ${{ runner.temp }}/rel
      - name: 做镜像
        run: |
          cd "$RUNNER_TEMP/rel" && tar -xzf arcade-*.tar.gz
          docker build -f "$GITHUB_WORKSPACE/tools/selfhost/docker/Dockerfile" -t arcade:ci "$RUNNER_TEMP/rel/arcade-ci-${{ github.sha }}"
      - name: 起容器、冒烟、容器里跑备份和定时任务
        run: |
          r() { echo "k1:$(head -c 32 /dev/urandom | base64 | tr -d '/+=')"; }
          # mask 那行要打到日志（stdout）里才生效，值只写进文件
          : > "$RUNNER_TEMP/secrets.env"
          for k in PEPPER_PW PEPPER_RC PEPPER_SID PEPPER_IP ADMIN_TOKEN; do v=$(r); echo "::add-mask::$v"; echo "$k=$v" >> "$RUNNER_TEMP/secrets.env"; done
          # README 的自托管推荐值原样带上（这个包只有平台和德州）：docker run --env-file 不处理引号，值写错容器就起不来
          grep -E '^ARCADE_VARS_(arcade|texas)_' tools/selfhost/README.md >> "$RUNNER_TEMP/secrets.env"
          [ "$(grep -c '^ARCADE_VARS_' "$RUNNER_TEMP/secrets.env")" = 2 ]
          docker run -d --name arcade --env-file "$RUNNER_TEMP/secrets.env" -p 127.0.0.1:8787:8787 arcade:ci
          for _ in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' arcade)" = healthy ] && break; sleep 1; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' arcade)" = healthy ]
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          node tools/selfhost/smoke.mjs --admin skip
          # 推荐值里每一项平台和 kit 都认（不认的项它们会回退默认值并记这两种日志）
          if docker logs arcade 2>&1 | grep -E 'bad limit|KIT_QUOTA'; then echo "::error::README 的推荐值有不认的项"; exit 1; fi
          # 管理入口宿主连不到，只在容器里
          if curl -fsS --max-time 2 http://127.0.0.1:8788/d1; then echo "::error::宿主连上了管理入口"; exit 1; fi
          docker exec arcade curl -fsS -X POST 'http://127.0.0.1:8788/cron/run?worker=arcade&cron=17%2019%20*%20*%20*' | grep -q '"outcome":"ok"'
          docker exec arcade /app/ops/backup.sh /data/backups
          # 重启容器后数据还在（卷里）
          docker restart arcade
          for _ in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' arcade)" = healthy ] && break; sleep 1; done
          docker exec arcade sh -c 'curl -fsS http://127.0.0.1:8788/d1/d1-arcade-DB/export | grep -c "INSERT INTO \"users\"" | grep -qx 2'
      - name: compose 文件能解析
        run: |
          cd tools/selfhost/docker && touch secrets.env
          SITE_HOST=game.example.com docker compose config -q
          SITE_HOST=game.example.com docker compose --profile pg config -q
      - name: 失败时的容器日志
        if: failure()
        run: docker logs arcade 2>&1 | tail -200 || true
  pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # 服务容器的默认库是 en_US.utf8 排序：故意不用 C，PG 版迁移的 COLLATE "C" 和覆盖表的排序要在这里经得住
      ARCADE_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/arcade-host/.nvmrc
          cache: npm
          cache-dependency-path: |
            tools/deployer/package-lock.json
            packages/arcade-host/package-lock.json
            platform/package-lock.json
            games/texas/package-lock.json
      - name: 装钉死的 wrangler 和运行时
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/deployer
          (cd packages/arcade-host && npm ci --no-audit --no-fund && npm run build)
      - name: 平台的每条 SQL 在 PG 上过一遍（check-sql）
        run: node tools/selfhost/pg/check-sql.mjs --pg "$ARCADE_PG_URL"
      - name: 打包平台和德州，出 SQLite 档、PG 档、PG + 不落盘三个发布包
        run: |
          tools/selfhost/pack-all.sh "$RUNNER_TEMP/art" arcade texas
          ARCADE_VERSION=ci-sqlite tools/selfhost/release.sh "$RUNNER_TEMP/art" "$RUNNER_TEMP/out" --only arcade,texas
          ARCADE_VERSION=ci-pg tools/selfhost/release.sh "$RUNNER_TEMP/art" "$RUNNER_TEMP/out" --only arcade,texas --db pg
          ARCADE_VERSION=ci-pgmem tools/selfhost/release.sh "$RUNNER_TEMP/art" "$RUNNER_TEMP/out" --only arcade,texas --db pg --storage memory
      - name: 临时 Secret（只在这次运行里）
        run: |
          r() { echo "k1:$(head -c 32 /dev/urandom | base64 | tr -d '/+=')"; }
          # mask 那行要打到日志（stdout）里才生效，值只写进文件
          : > "$RUNNER_TEMP/secrets.env"
          for k in PEPPER_PW PEPPER_RC PEPPER_SID PEPPER_IP ADMIN_TOKEN; do v=$(r); echo "::add-mask::$v"; echo "$k=$v" >> "$RUNNER_TEMP/secrets.env"; done
      - name: SQLite 档起站、冒烟、备份
        run: |
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          ARCADE_DATA="$RUNNER_TEMP/data-sqlite" "$RUNNER_TEMP/out/arcade-ci-sqlite/bin/arcade" > "$RUNNER_TEMP/workerd-sqlite.log" 2>&1 &
          pid=$!
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:8787/__health >/dev/null 2>&1 && break; sleep 0.2; done
          node tools/selfhost/smoke.mjs
          "$RUNNER_TEMP/out/arcade-ci-sqlite/ops/backup.sh" "$RUNNER_TEMP/backups" http://127.0.0.1:8788 "$RUNNER_TEMP/data-sqlite"
          kill "$pid"; wait "$pid" || true
      - name: PG 档起站、冒烟；SQLite 的备份迁进 PG、逐行核对、再冒烟
        run: |
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          ARCADE_DATA="$RUNNER_TEMP/data-pg" "$RUNNER_TEMP/out/arcade-ci-pg/bin/arcade" > "$RUNNER_TEMP/workerd-pg.log" 2>&1 &
          pid=$!
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:8787/__health >/dev/null 2>&1 && break; sleep 0.2; done
          node tools/selfhost/smoke.mjs
          dump=$(ls "$RUNNER_TEMP"/backups/*/d1-arcade-DB.sql | tail -1)
          "$RUNNER_TEMP/out/arcade-ci-pg/ops/restore.sh" d1-arcade-DB "$dump" | tee "$RUNNER_TEMP/import.json"
          grep -q '"ok":true' "$RUNNER_TEMP/import.json"
          node tools/selfhost/pg/verify-import.mjs "$dump" --pg "$ARCADE_PG_URL"
          node tools/selfhost/smoke.mjs
          # PG 模式的备份：平台库跳过（用 pg_dump），不报错
          "$RUNNER_TEMP/out/arcade-ci-pg/ops/backup.sh" "$RUNNER_TEMP/backups-pg" http://127.0.0.1:8788 "$RUNNER_TEMP/data-pg"
          # 没给连接串起不来
          if env -u ARCADE_PG_URL ARCADE_DATA="$RUNNER_TEMP/x" "$RUNNER_TEMP/out/arcade-ci-pg/bin/arcade"; then echo "::error::没有 ARCADE_PG_URL 也起来了"; exit 1; fi
          kill "$pid"; wait "$pid" || true
      - name: 房间也进 PG（pg + memory）：冒烟、重启、回到同一个房间
        run: |
          set -a; . "$RUNNER_TEMP/secrets.env"; set +a
          rel="$RUNNER_TEMP/out/arcade-ci-pgmem"
          up() {
            "$rel/bin/arcade" >> "$RUNNER_TEMP/workerd-pgmem.log" 2>&1 &
            pid=$!
            for _ in $(seq 50); do curl -fsS http://127.0.0.1:8787/__health >/dev/null 2>&1 && return; sleep 0.2; done
          }
          up
          node tools/selfhost/smoke.mjs --save "$RUNNER_TEMP/room.json"
          kill "$pid"; wait "$pid" || true
          up
          node tools/selfhost/smoke.mjs --rejoin "$RUNNER_TEMP/room.json"
          # 重启后宿主按 PG 里存的闹钟叫醒了房间（kitWake），没有失败的
          grep '"msg":"kitstore wake"' "$RUNNER_TEMP/workerd-pgmem.log" | tail -1 | tee "$RUNNER_TEMP/wake.json"
          grep -q '"failed":\[\]' "$RUNNER_TEMP/wake.json"
          kill "$pid"; wait "$pid" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-release-pgmem
          path: ${{ runner.temp }}/out/arcade-ci-pgmem.tar.gz
          retention-days: 1
      - name: 失败时的 workerd 日志
        if: failure()
        run: tail -100 "$RUNNER_TEMP"/workerd-*.log || true
  docker-pg:
    needs: pg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/arcade-host/.nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selfhost-release-pgmem
          path: ${{ runner.temp }}/rel
      - name: 做镜像
        run: |
          cd "$RUNNER_TEMP/rel" && tar -xzf arcade-ci-pgmem.tar.gz
          docker build -f "$GITHUB_WORKSPACE/tools/selfhost/docker/Dockerfile" -t arcade:ci-pg "$RUNNER_TEMP/rel/arcade-ci-pgmem"
      - name: compose --profile pg 起 arcade + postgres、冒烟、重启后回房间、容器里跑定时任务和备份
        working-directory: tools/selfhost/docker
        env:
          SITE_HOST: game.example.com
          ARCADE_IMAGE: arcade:ci-pg
        run: |
          r() { echo "k1:$(head -c 32 /dev/urandom | base64 | tr -d '/+=')"; }
          # mask 那行要打到日志（stdout）里才生效，值只写进文件
          pw=$(head -c 24 /dev/urandom | base64 | tr -d '/+='); echo "::add-mask::$pw"
          printf '%s\n' "$pw" > pg_password.txt
          : > secrets.env
          for k in PEPPER_PW PEPPER_RC PEPPER_SID PEPPER_IP ADMIN_TOKEN; do v=$(r); echo "::add-mask::$v"; echo "$k=$v" >> secrets.env; done
          echo "ARCADE_PG_URL=postgres://arcade:$pw@postgres:5432/arcade" >> secrets.env
          # 只在 CI：站点发布到宿主的回环口给冒烟连（正式用法是只给 caddy 连）；caddy 不起
          printf 'services:\n  arcade:\n    ports:\n      - "127.0.0.1:8787:8787"\n' > "$RUNNER_TEMP/ci.yaml"
          dc() { docker compose --profile pg -f compose.yaml -f "$RUNNER_TEMP/ci.yaml" "$@"; }
          healthy() { for _ in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(dc ps -q arcade)")" = healthy ] && return; sleep 1; done; return 1; }
          dc up -d arcade postgres
          healthy
          set -a; . ./secrets.env; set +a
          cd "$GITHUB_WORKSPACE"
          node tools/selfhost/smoke.mjs --admin skip --save "$RUNNER_TEMP/room.json"
          cd tools/selfhost/docker
          # 平台库和房间都在 PG：arcade 容器重启（内存全丢）后，两人回到同一个房间
          dc restart arcade
          healthy
          cd "$GITHUB_WORKSPACE" && node tools/selfhost/smoke.mjs --rejoin "$RUNNER_TEMP/room.json" && cd tools/selfhost/docker
          dc logs arcade | grep '"msg":"kitstore wake"' | tail -1 | grep -q '"failed":\[\]'
          dc exec -T arcade curl -fsS -X POST 'http://127.0.0.1:8788/cron/run?worker=arcade&cron=17%2019%20*%20*%20*' | grep -q '"outcome":"ok"'
          dc exec -T arcade /app/ops/backup.sh /data/backups | grep -q 'PostgreSQL 里，跳过'
          # 冒烟建的两个号在 PG 里（arcade 容器重启过，还在）
          [ "$(dc exec -T postgres psql -U arcade -d arcade -tAc "SELECT count(*) FROM users WHERE username LIKE 'smoke%'")" = 2 ]
      - name: 失败时的容器日志
        if: failure()
        working-directory: tools/selfhost/docker
        run: docker compose --profile pg logs 2>&1 | tail -200 || true
