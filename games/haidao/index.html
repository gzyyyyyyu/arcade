<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="海岛" />
    <title>海岛</title>
    <meta name="description" content="《海岛》：建自己的海盗岛，开船登陆打别的岛，抢资源、拿星星。" />
    <meta name="theme-color" content="#2aa7c9" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #2aa7c9; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* 画面按看得见的区域铺：100vh → 100dvh → 脚本按 visualViewport 写的 --app-h；四边让出刘海和圆角 */
      #stage {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        left: env(safe-area-inset-left, 0px);
        width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
        height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        height: calc(var(--app-h, 100vh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        overflow: hidden;
      }
      #app { position: absolute; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: linear-gradient(#5cc7e0, #2aa7c9); color: #fff8e6; z-index: 50;
        font: 16px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; pointer-events: none;
      }
      #boot b { font-size: 48px; letter-spacing: 12px; text-shadow: 0 3px 0 #4a3320, 0 0 12px rgba(0,0,0,.25); }
      #boot span { max-width: min(90%, 420px); text-align: center; }
      #boot .bar { width: min(70%, 280px); height: 12px; border-radius: 6px; background: rgba(0,0,0,.22); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0; background: #ffd75a; transition: width .15s linear; }
      #boot button {
        pointer-events: auto; min-width: 120px; min-height: 44px; padding: 0 24px; border: 3px solid #2b1a15; border-radius: 12px;
        background: #f8c630; color: #2b1a15; font: 800 16px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; cursor: pointer;
      }
      noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff8e6; background: #2aa7c9; font: 16px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="app"></div><div id="ui"></div></div>
    <div id="boot"><b>海岛</b><div class="bar"><i></i></div><span>正在起锚…</span></div>
    <noscript>《海岛》需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
